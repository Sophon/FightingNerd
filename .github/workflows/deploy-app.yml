name: Deploy App

on:
  push:
    branches:
      - app_release

permissions:
  contents: write

jobs:
  # ========== SETUP: version, tag, changelog ==========
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      changelog: ${{ steps.changelog.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message and gradle.properties
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%B | head -n 1 | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Commit message '$VERSION' is not a valid version (expected vX.Y.Z)"
            exit 1
          fi
          VERSION_NAME=$(grep "^app.version.name=" gradle.properties | cut -d= -f2)
          if [[ "v${VERSION_NAME}" != "$VERSION" ]]; then
            echo "ERROR: gradle.properties app.version.name=${VERSION_NAME} does not match commit ${VERSION}"
            exit 1
          fi
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=app-${VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Extract changelog
        uses: mindsers/changelog-reader-action@v2
        id: changelog
        with:
          path: ./composeApp/CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
        continue-on-error: true

  # ========== ANDROID ==========
  android:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build AAB and APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ needs.setup.outputs.version_code }}
          REVENUECAT_API_KEY_ANDROID: ${{ secrets.REVENUECAT_API_KEY_ANDROID }}
        run: |
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: composeApp/build/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: composeApp/build/outputs/apk/release/FightingNerd-*.apk

      - name: Upload to Play Store (internal, draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.sophon.fightingnerd
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          mappingFile: composeApp/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

  # ========== iOS ==========
  ios:
    needs: setup
    runs-on: macos-26
    env:
      VERSION_NAME: ${{ needs.setup.outputs.version_name }}
      VERSION_CODE: ${{ needs.setup.outputs.version_code }}
      REVENUECAT_API_KEY_IOS: ${{ secrets.REVENUECAT_API_KEY_IOS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing assets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p $RUNNER_TEMP/signing
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/signing/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/signing/profile.mobileprovision
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Create temporary keychain and import certificate
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import $RUNNER_TEMP/signing/cert.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp $RUNNER_TEMP/signing/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $RUNNER_TEMP/signing/profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

      - name: Extract provisioning profile name
        id: profile
        run: |
          PROFILE_NAME=$(security cms -D -i $RUNNER_TEMP/signing/profile.mobileprovision | plutil -extract Name raw -)
          echo "name=$PROFILE_NAME" >> $GITHUB_OUTPUT

      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9W27GN3AUW</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>io.github.sophon.fightingnerd</key>
                  <string>${{ steps.profile.outputs.name }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -destination "generic/platform=iOS" \
            MARKETING_VERSION=${{ env.VERSION_NAME }} \
            CURRENT_PROJECT_VERSION=${{ env.VERSION_CODE }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Rename IPA
        run: |
            mv $RUNNER_TEMP/export/FightingNerd.ipa $RUNNER_TEMP/export/FightingNerd-v${{ env.VERSION_NAME }}.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/export/FightingNerd-v*.ipa

      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-dsyms
          path: ${{ runner.temp }}/iosApp.xcarchive/dSYMs

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/FightingNerd-v${{ env.VERSION_NAME }}.ipa \
            -t ios \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

  # ========== GITHUB RELEASE ==========
  release:
    needs: [setup, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: artifacts

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: app-release-ipa
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: App ${{ needs.setup.outputs.version }}
          body: ${{ needs.setup.outputs.changelog || 'No changelog entry found' }}
          files: |
            artifacts/FightingNerd-*.apk
            artifacts/FightingNerd-*.ipa
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}