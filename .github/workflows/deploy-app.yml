name: Deploy App

on:
  push:
    branches:
      - app_release

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ========== CHECKOUT & VERSION ==========
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%B | head -n 1 | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Commit message '$VERSION' is not a valid version (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=app-${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      # ========== BUILD SETUP ==========
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # ========== BUILD ==========
      - name: Build AAB and APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease

      # ========== ARTIFACT BACKUP ==========
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: composeApp/build/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: composeApp/build/outputs/apk/release/FightingNerd-*.apk

      # ========== PLAY STORE UPLOAD ==========
      - name: Upload to Play Store (internal, draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.sophon.fightingnerd
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          mappingFile: composeApp/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

      # ========== CHANGELOG & RELEASE ==========
      - name: Extract changelog
        uses: mindsers/changelog-reader-action@v2
        id: changelog
        with:
          path: ./composeApp/CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: App ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes || 'No changelog entry found' }}
          files: composeApp/build/outputs/apk/release/FightingNerd-*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}