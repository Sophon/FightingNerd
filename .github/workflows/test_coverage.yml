name: Test Coverage

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify use case tests exist
        run: ./gradlew testCoverage

      - name: Run tests
        run: ./gradlew jvmTest