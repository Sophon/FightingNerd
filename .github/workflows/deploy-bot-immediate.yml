name: Deploy Discord Bot to Fly.io

on:
  push:
    branches:
      - release_bot

permissions:
  contents: write
  packages: write  # ← For pushing Docker images to GHCR

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%B)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=bot-${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      # ========== DOCKER IMAGE ==========
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sophon/fightingnerd/bot:${{ steps.version.outputs.version }}
            ghcr.io/sophon/fightingnerd/bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== FLY.IO DEPLOYMENT ==========
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --no-cache --app fightingnerd
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ========== CHANGELOG & RELEASE ==========
      - name: Extract changelog
        uses: mindsers/changelog-reader-action@v2
        id: changelog
        with:
          path: ./bot/discord/CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
        continue-on-error: true  # Don't fail if version not found in changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bot ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes || 'No changelog entry found' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}