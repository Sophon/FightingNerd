app = 'fightingnerd'
primary_region = 'fra'

[build]

[env]
  ENV = "production"
  DATABASE_PATH = "/data/banlist.db"

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
source = "admin_data"
destination = "/data"
